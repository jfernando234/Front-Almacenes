<div class="container mt-4">
  <div class="row">
    <!-- Widgets -->
    <div class="col-md-3" *ngFor="let producto of stockBajo">
      <div class="card text-white bg-danger mb-3">
        <div class="card-header">Stock Bajo</div>
        <div class="card-body">
          <h5 class="card-title">{{producto.nombre}}</h5>
          <p class="card-text">Cantidad: {{producto.stock}}</p>
        </div>
      </div>
    </div>

    <div class="col-md-3" *ngFor="let transferencia of ultimasTransferencias">
      <div class="card text-dark bg-light mb-3">
        <div class="card-header">Últimas Transferencias</div>
        <div class="card-body">
          <p class="card-text">{{transferencia}}</p>
        </div>
      </div>
    </div>

    <div class="col-md-3" *ngFor="let pedido of ultimosPedidos">
      <div class="card text-dark bg-warning mb-3">
        <div class="card-header">Últimos Pedidos</div>
        <div class="card-body">
          <p class="card-text">{{pedido}}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <!-- Gráficos -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">Tendencias de Inventario</div>
        <div class="card-body">
          <!-- Chart placeholder (ng2-charts not initialized) -->
          <div class="chart-placeholder">
            <p>Gráfico de inventario (requiere ng2-charts)</p>
          </div>

        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card">
        <div class="card-header">Movimientos Entrada/Salida</div>
        <div class="card-body">
          <!-- Chart placeholder (ng2-charts not initialized) -->
          <div class="chart-placeholder">
            <p>Gráfico de movimientos (requiere ng2-charts)</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
