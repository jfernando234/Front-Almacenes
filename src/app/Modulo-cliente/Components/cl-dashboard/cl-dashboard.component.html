<!-- cl-dashboard.component.html -->
<div class="container mt-4">
  <div class="row g-4">
    <!-- Barras -->
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header">Ventas por mes</div>
        <div class="card-body">
          <ngx-charts-bar-vertical
            [view]="barView"
            [scheme]="'vivid'"
            [results]="barData"
            [legend]="barShowLegend"
            [xAxis]="barShowXAxis"
            [yAxis]="barShowYAxis"
            [xAxisLabel]="barXAxisLabel"
            [yAxisLabel]="barYAxisLabel">
          </ngx-charts-bar-vertical>
        </div>
      </div>
    </div>

    <!-- Pastel -->
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header">Distribución de usuarios</div>
        <div class="card-body">
          <ngx-charts-pie-chart
            [view]="pieView"
            [scheme]="'natural'"
            [results]="pieData">
          </ngx-charts-pie-chart>
        </div>
      </div>
    </div>

    <!-- Línea -->
    <div class="col-12">
      <div class="card shadow mt-4">
        <div class="card-header">Usuarios nuevos por semana</div>
        <div class="card-body">
          <ngx-charts-line-chart
            [view]="lineView"
            [scheme]="'cool'"
            [results]="lineData"
            [xAxis]="lineShowXAxis"
            [yAxis]="lineShowYAxis"
            [showGridLines]="lineShowGridLines"
            [legend]="lineShowLegend">
          </ngx-charts-line-chart>
        </div>
      </div>
    </div>
  </div>
</div>
