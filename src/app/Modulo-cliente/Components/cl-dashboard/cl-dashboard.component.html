<div class="container mt-4">
  <div class="row g-4">
    <!-- Gráfico de barras -->
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header">Ventas por mes</div>
        <div class="card-body">
          <canvas baseChart
                  [data]="barChartData"
                  [options]="barChartOptions"
                  [type]="'bar'">
          </canvas>
        </div>
      </div>
    </div>

    <!-- Gráfico de pastel -->
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header">Distribución de usuarios</div>
        <div class="card-body">
          <canvas baseChart
                  [data]="pieChartData"
                  [type]="'pie'">
          </canvas>
        </div>
      </div>
    </div>

    <!-- Gráfico de líneas -->
    <div class="col-12">
      <div class="card shadow mt-4">
        <div class="card-header">Usuarios nuevos por semana</div>
        <div class="card-body">
          <canvas baseChart
                  [data]="lineChartData"
                  [options]="lineChartOptions"
                  [type]="'line'">
          </canvas>
        </div>
      </div>
    </div>
  </div>
</div>
